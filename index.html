<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta name="google-site-verification" content="l4_8Nb0Pb3uKVEW5Tvar3PKNvDlOj0WFtDDuXs2Nd9E" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مغامرة إنقاذ عالم المادة</title>
<meta name="theme-color" content="#0a0e2e">
<style>
:root{--bg1:#0a0e2e;--bg2:#1b1157;--pu:#8b5cf6;--tq:#22d3c5;--bl:#38a3ff;--gr:#34d399;--rd:#fb7185;--yl:#fbbf24;--tx:#eef2ff;--mu:#aab4e6;--card:rgba(255,255,255,.075);--bd:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:"Segoe UI","Noto Kufi Arabic","Noto Sans Arabic",Cairo,Tahoma,"Geeza Pro",Arial,sans-serif;color:var(--tx);line-height:1.75;background:radial-gradient(1200px 700px at 85% -10%,#3b1f94 0,transparent 60%),radial-gradient(900px 600px at 0% 100%,#06577a 0,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 80%);mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 80%)}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fa{position:absolute;top:0;border-radius:50%;border:2px solid rgba(124,200,255,.25);animation:drift linear infinite}
.fa::after{content:"";position:absolute;inset:38%;border-radius:50%;background:rgba(124,200,255,.35)}
@keyframes drift{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-25vh) rotate(360deg)}}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 14px 50px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.35}
p{margin:.4em 0}
.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 auto;max-width:1100px;background:rgba(10,14,46,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);border-radius:0 0 18px 18px}
.hud[hidden]{display:none}
.hud-mid{flex:1;min-width:0}
.keys{display:flex;gap:6px;justify-content:center;font-size:1.15rem}
.keys span{width:34px;height:30px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--bd)}
.keys span.on{background:linear-gradient(135deg,#fde68a55,#f59e0b55);border-color:#fbbf24;box-shadow:0 0 12px #fbbf2466}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tq),var(--pu));transition:width .6s}
.hlabel{text-align:center;font-size:.78rem;color:var(--mu)}
.score{font-weight:800;font-size:1.1rem;background:rgba(251,191,36,.15);border:1px solid #fbbf2466;border-radius:14px;padding:4px 12px;white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.1);font-size:1.15rem}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.fp{position:fixed;top:62px;left:20px;z-index:60;font-weight:900;font-size:1.6rem;color:var(--yl);text-shadow:0 0 12px #f59e0b;animation:fp 1.1s ease forwards;pointer-events:none}
@keyframes fp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(40px)}}
.btn{border:1px solid var(--bd);border-radius:16px;padding:12px 22px;font-weight:700;font-size:1.05rem;background:rgba(255,255,255,.12);transition:.2s}
.btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.22)}
.btn.primary{background:linear-gradient(135deg,var(--pu),var(--tq));border:0;box-shadow:0 8px 24px rgba(99,102,241,.45)}
.btn.big{font-size:1.3rem;padding:16px 38px;border-radius:20px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,197,.6)}50%{box-shadow:0 0 0 14px rgba(34,211,197,0)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.scr{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes bub{from{transform:translateY(0);opacity:.9}to{transform:translateY(-40px);opacity:0}}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);z-index:80;padding:12px 20px;border-radius:16px;background:#1e2a78;border:1px solid var(--bd);font-weight:700;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;text-align:center;box-shadow:0 10px 30px #0008}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#7f1d3a;border-color:#fb7185}
#toast.good{background:#065f46;border-color:#34d399}
#modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(3,6,25,.78);backdrop-filter:blur(6px);padding:16px}
#modal.open{display:grid}
.mbox{max-width:480px;width:100%;background:linear-gradient(160deg,#1a2170,#2a1670);border:1px solid var(--bd);border-radius:26px;padding:26px;text-align:center;animation:rise .4s ease}
.keyart{width:170px;filter:drop-shadow(0 0 18px #fbbf24);animation:keyf 2s ease-in-out infinite}
@keyframes keyf{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* start */
.start{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:center;min-height:calc(100vh - 60px)}
.labsvg{width:100%;height:auto;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--bd)}
.labsvg .spin{animation:spin 14s linear infinite;transform-origin:0 0}
.labsvg .blink{animation:blink 1.2s infinite}
.labsvg .bub{animation:bub 2.4s infinite}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;background:rgba(34,211,197,.15);border:1px solid #22d3c566;color:#7ff5ea;font-size:.85rem;margin-bottom:10px}
.start h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900}
.start h1 span{background:linear-gradient(90deg,var(--tq),#a78bfa,var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
.story{margin:14px 0;font-size:1.05rem}
.story b{color:var(--yl)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.feat{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;color:var(--mu);font-size:.9rem}
.feat span{background:rgba(255,255,255,.07);border-radius:12px;padding:3px 12px}

/* hub */
.hub-head{margin:14px 0;text-align:center}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:14px}
.door{position:relative;border:1px solid var(--bd);border-radius:24px;padding:14px 10px 16px;background:var(--card);text-align:center;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:6px}
.door:hover{transform:translateY(-6px)}
.dnum{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--rc);color:#fff}
.dleaf{width:112px;height:140px;border-radius:56px 56px 8px 8px;background:linear-gradient(160deg,var(--rc),#1c2470);border:4px solid rgba(255,255,255,.35);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 20px #0006}
.dwin{font-size:2.8rem;filter:drop-shadow(0 0 10px #fff8)}
.dknob{position:absolute;left:14px;top:72px;width:12px;height:12px;border-radius:50%;background:#fde68a}
.dname{font-weight:800}
.dst{font-size:.9rem;color:var(--mu)}
.door.locked{opacity:.6}
.door.locked .dleaf{filter:grayscale(1) brightness(.6)}
.door.locked .dwin{opacity:.3}
.door.done .dst{color:var(--gr)}
.door.open{box-shadow:0 0 0 2px var(--rc),0 0 24px -4px var(--rc)}
.door.justopened{animation:unl 1.2s ease}
@keyframes unl{0%{transform:scale(.9);filter:brightness(2)}50%{transform:scale(1.08)}100%{transform:none}}
.next-hint{margin-top:16px;text-align:center;color:var(--yl);font-weight:700}
.foot{text-align:center;margin-top:20px}
.link{background:none;border:0;color:var(--mu);text-decoration:underline;font-size:.9rem}

/* room */
.room-head{display:flex;align-items:center;gap:14px;margin:14px 0}
.badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,var(--rc),#1c2470);box-shadow:0 0 20px -2px var(--rc)}
.kicker{color:var(--mu);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.steps button{padding:10px 6px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.07);font-weight:700;font-size:.95rem}
.steps button.act{background:linear-gradient(135deg,var(--rc),var(--pu));border-color:transparent}
.steps button.ok:not(.act){border-color:var(--gr)}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.center{text-align:center}
.hint{color:var(--yl);font-weight:700}
.nextbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--bd)}
.need{color:var(--mu);font-weight:700}
.pill{display:inline-block;padding:2px 12px;border-radius:20px;background:rgba(255,255,255,.12);font-size:.88rem}
.ib{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.bigsym{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:900;background:var(--c);box-shadow:0 0 22px -2px var(--c);flex:none}
.info{min-height:220px}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.lg{border:1px solid var(--bd);background:rgba(255,255,255,.08);border-radius:20px;padding:4px 14px;font-size:.9rem}
.lg:hover{background:rgba(255,255,255,.2)}
.atomsvg{width:100%;max-width:400px;height:auto}
.atomsvg .part,.atomsvg [data-k]{cursor:pointer}
.atomsvg .part:hover circle{filter:brightness(1.3)}
.atomsvg .found circle:first-child{stroke:#fde68a;stroke-width:3}
.o1{animation:spin 6s linear infinite;transform-origin:180px 180px}
.o2{animation:spin 11s linear infinite reverse;transform-origin:180px 180px}
.pt-wrap{overflow-x:auto;padding-bottom:6px}
.ptw{overflow-x:auto}
.pt{direction:ltr;display:grid;grid-template-columns:26px repeat(18,minmax(40px,1fr));grid-auto-rows:minmax(50px,auto);gap:4px;min-width:780px}
.pt .gh,.pt .ph{font-style:normal;font-size:.72rem;color:var(--mu);display:grid;place-items:center}
.ec{--ec:#4b5bd6;background:var(--ec);border:1px solid rgba(255,255,255,.35);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:3px 1px;transition:.2s;color:#fff;font-family:inherit}
.ec small{font-size:.62rem;opacity:.85}
.ec b{font-size:1.1rem}
.ec span{font-size:.58rem;opacity:.9;direction:rtl}
.ec:hover{transform:scale(1.12);z-index:2}
.ec.mt{--ec:#d97706}.ec.nm{--ec:#0d9488}.ec.ml{--ec:#7c3aed}.ec.ng{--ec:#2563eb}
.pt.plain:not(.showc) .ec{--ec:#3d4bb8}
.ec.hl{box-shadow:0 0 0 2px #fde68a}
.ec.sel{outline:3px solid #fff;transform:scale(1.14);z-index:3}
.ec.dim{opacity:.22}
.ec.wrong{animation:shake .5s;background:#e11d48}
.gap{grid-column:4/14;grid-row:2/6;border:2px dashed rgba(255,255,255,.2);border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:.85rem;direction:rtl;padding:8px}
.ptcap{font-size:.82rem;color:var(--mu);margin:4px 0}
.elcard{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.etile{width:84px;height:84px;border-radius:18px;background:var(--ec);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:0 0 22px -3px var(--ec)}
.etile small{font-size:.75rem}.etile b{font-size:2rem;line-height:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.facts div{background:rgba(255,255,255,.07);border-radius:12px;padding:4px 10px;font-size:.92rem}
.task{background:rgba(251,191,36,.12);border:1px solid #fbbf2466;border-radius:16px;padding:10px 14px;font-weight:800;margin:10px 0}
.fb{margin-top:12px;min-height:10px}
.good{background:rgba(52,211,153,.15);border:1px solid var(--gr);border-radius:16px;padding:10px 14px}
.badm{background:rgba(251,113,133,.15);border:1px solid var(--rd);border-radius:16px;padding:10px 14px}
.gain{color:var(--yl);margin-right:6px}

/* sort / drag */
.sort .bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border:2px dashed var(--bd);border-radius:18px;margin-bottom:14px;min-height:64px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);font-weight:700;border:1px solid rgba(255,255,255,.3);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s}
.chip.sel{outline:3px solid var(--yl);transform:scale(1.06)}
.chip.dragging{opacity:.3}
.chip.placed{cursor:default;background:linear-gradient(135deg,#059669,#10b981)}
.chip.bad{animation:shake .5s;background:#e11d48}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:rotate(-4deg) scale(1.06);text-align:center}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.zone{min-height:150px;border:2px dashed rgba(255,255,255,.35);border-radius:18px;padding:10px;background:rgba(255,255,255,.05);transition:.2s}
.zone:hover,.zone:focus-visible{background:rgba(255,255,255,.13);border-color:var(--tq);outline:0}
.zone.shake{animation:shake .5s;border-color:var(--rd)}
.zone.nucleus{border-color:#fb7185;background:radial-gradient(circle,#fb718533,transparent 75%)}
.zone.orbit{border-color:#38a3ff;background:radial-gradient(circle,#38a3ff2a,transparent 75%)}
.zt{font-weight:800;text-align:center;margin-bottom:8px}
.zi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{border:1px solid var(--bd);background:rgba(255,255,255,.1);border-radius:14px;padding:12px;font-weight:700;transition:.2s}
.mi:hover:not(.ok){background:rgba(255,255,255,.2)}
.mi.sel{outline:3px solid var(--yl);background:rgba(251,191,36,.2)}
.mi.ok{cursor:default;color:#fff}
.mi.pc0{background:#059669}.mi.pc1{background:#2563eb}.mi.pc2{background:#c026d3}.mi.pc3{background:#d97706}
.mi.shake{animation:shake .5s;background:#e11d48}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.qbar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yl),var(--rd));transition:width .5s}
.qt{font-size:1.25rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--bd);background:rgba(255,255,255,.09);border-radius:16px;padding:14px;font-weight:700;font-size:1.05rem;transition:.2s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.2);transform:translateY(-2px)}
.opt.bad{background:#7f1d3a;border-color:var(--rd);opacity:.8}
.opt.good{background:#065f46;border-color:var(--gr)}
.qnext{margin-top:14px;text-align:center}

/* room3 */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.obj{border:1px solid var(--bd);background:rgba(255,255,255,.08);border-radius:18px;padding:10px 4px;text-align:center;transition:.2s}
.obj:hover{transform:translateY(-4px);background:rgba(255,255,255,.18)}
.obj.sel{outline:3px solid var(--tq)}
.obj.seen{border-color:var(--gr)}
.obj .e{font-size:2.2rem;display:block}
.obj .n{font-size:.88rem;font-weight:700}
.cv{width:100%;max-width:280px;border-radius:14px;background:#0a1240;border:1px solid var(--bd)}
.nomat{padding:20px;border-radius:14px;background:rgba(251,113,133,.12);border:1px dashed var(--rd);text-align:center}
table.pr{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
table.pr td,table.pr th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:right}
table.pr th{color:var(--yl);width:26%}
select{font:inherit;background:#1b2370;color:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px;width:100%;margin-top:8px}

/* room4 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.07);font-weight:800}
.tabs button.act{background:linear-gradient(135deg,var(--pu),var(--tq));border-color:transparent}
.tabs button.ok::after{content:" ✅"}
.bsvg{width:100%;height:auto;background:radial-gradient(circle at 50% 40%,#1a2480,#0a1040);border-radius:18px;border:1px solid var(--bd)}
.bsvg .t{transition:transform 1.1s ease}
.bsvg .el{fill:#38a3ff;stroke:#fff;stroke-width:1.5}
.bsvg .el.hot{fill:#fbbf24}
.bsvg .ring{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2;stroke-dasharray:5 5;transition:.8s}
.bsvg .ring.lost{opacity:.18}
.bsvg text{fill:#fff;text-anchor:middle;font-family:inherit}
.bsvg .fade{transition:opacity .8s}
.steps4{margin:8px 0;padding-right:20px}
.steps4 li{margin:4px 0}
.palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.ach{min-width:120px;border:2px solid var(--bd);background:rgba(255,255,255,.09);border-radius:16px;padding:8px 12px;text-align:center}
.ach:hover{background:rgba(255,255,255,.2)}
.ach b{font-size:1.5rem;display:block}
.ach small{font-size:.76rem;color:var(--mu);display:block;line-height:1.3}
.slots{display:flex;align-items:center;justify-content:center;gap:14px;font-size:1.6rem;margin:10px 0;flex-wrap:wrap}
.slot{width:90px;height:90px;border:3px dashed var(--bd);border-radius:50%;display:grid;place-items:center;font-size:1.8rem;font-weight:900;background:rgba(255,255,255,.06)}
.slot.f{border-style:solid;border-color:var(--tq);background:rgba(34,211,197,.15)}
.types{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tb{padding:12px 20px;border-radius:16px;border:2px solid var(--bd);background:rgba(255,255,255,.09);font-weight:800}
.tb.sel{border-color:var(--yl);background:rgba(251,191,36,.2)}

/* final */
.final{position:relative;min-height:80vh}
.shade{position:fixed;inset:0;background:rgba(0,0,10,.82);z-index:0;transition:opacity 2s;pointer-events:none}
.final:not(.dark) .shade{opacity:0}
.ctrl,.resbox{position:relative;z-index:1;max-width:760px;margin:20px auto;text-align:center}
.reactor{width:150px;height:150px;border-radius:50%;margin:10px auto;border:6px solid #3b4aa8;display:grid;place-items:center;background:#0a0f33;transition:.8s}
.reactor .core{width:70px;height:70px;border-radius:50%;background:#334;transition:.8s}
.reactor.on{border-color:var(--tq);box-shadow:0 0 50px var(--tq),inset 0 0 30px #22d3c566}
.reactor.on .core{background:radial-gradient(circle,#fff,var(--tq));box-shadow:0 0 40px #fff;animation:pulse 1.5s infinite}
.socks{display:flex;gap:12px;justify-content:center;margin:10px 0}
.sock{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;border:2px dashed var(--bd);opacity:.5;transition:.5s}
.sock.on{opacity:1;border:2px solid var(--yl);background:#fbbf2433;box-shadow:0 0 18px #fbbf2488}
.log{list-style:none;padding:0;margin:10px 0;text-align:right;min-height:10px}

<body>

<script>
"use strict";
/* ============ أدوات ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const app=$('#app');
let timers=[],cleanups=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
function clean(){timers.forEach(clearTimeout);timers=[];cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];$$('.ghost,.cf').forEach(x=>x.remove());DND.drag=null}
let tT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(tT);tT=setTimeout(()=>{t.className=''},3200)}
function modal(html){const m=$('#modal');m.innerHTML='<div class="mbox">'+html+'</div>';m.className='open'}
function closeModal(){const m=$('#modal');m.className='';m.innerHTML=''}
function confirmBox(msg,yes){modal('<h3>'+msg+'</h3><div class="row"><button class="btn primary" id="cy">نعم</button><button class="btn" id="cn">لا</button></div>');$('#cy').onclick=()=>{closeModal();yes()};$('#cn').onclick=closeModal}

/* ============ الحالة والحفظ ============ */
const SAVE='matterAdventure.v1';
function fresh(){return {points:0,keys:[false,false,false,false],awarded:{},finished:false,started:false,mute:false}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(d&&Array.isArray(d.keys)&&d.awarded)return Object.assign(fresh(),d)}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function award(id,pts){if(S.awarded[id]!==undefined)return 0;S.awarded[id]=pts;S.points+=pts;save();updateHUD();floatPts(pts);return pts}
function floatPts(p){const d=document.createElement('div');d.className='fp';d.textContent='+'+p;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function updateHUD(){
  $('#pts').textContent=S.points;
  const n=S.keys.filter(Boolean).length;
  $('#hudKeys').innerHTML=S.keys.map(k=>'<span class="'+(k?'on':'')+'">'+(k?'🗝️':'🔒')+'</span>').join('');
  $('#barFill').style.width=(n/4*100)+'%';
  $('#hudLabel').textContent='الغرف المكتملة: '+n+' / 4';
  $('#muteBtn').textContent=S.mute?'🔇':'🔊';
}

/* ============ الصوت (بدون ملفات) ============ */
let AC;
function beep(f,d,type,when,vol){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(when||0),v=vol||.06;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok(){beep(660,.15);beep(880,.2,'sine',.12)},bad(){beep(180,.25,'sawtooth',0,.04)},click(){beep(520,.07,'triangle')},key(){[523,659,784,1047].forEach((f,i)=>beep(f,.28,'sine',i*.12))},on(){[262,330,392,523,659,784].forEach((f,i)=>beep(f,.3,'triangle',i*.1))}};

/* ============ السحب والإفلات (ماوس + لمس + ضغط بديل) ============ */
const DND={drag:null};
function enableDrag(root,chipSel,zoneSel,onDrop){
  let sel=null;
  const tapChip=c=>{if(sel===c){c.classList.remove('sel');sel=null}else{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');sfx.click()}};
  const dropSel=z=>{const c=sel;sel=null;c.classList.remove('sel');onDrop(c,z)};
  root.addEventListener('pointerdown',e=>{
    const chip=e.target.closest(chipSel);
    if(!chip||chip.classList.contains('placed')||(e.button&&e.button>0))return;
    const r=chip.getBoundingClientRect();
    DND.drag={chip,root,zoneSel,onDrop,x0:e.clientX,y0:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:false,ghost:null,tap:()=>tapChip(chip)};
  });
  root.addEventListener('click',e=>{
    const z=e.target.closest(zoneSel),c=e.target.closest(chipSel);
    if(z&&sel&&(!c||c.classList.contains('placed')))dropSel(z);
  });
  root.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const c=e.target.closest(chipSel),z=e.target.closest(zoneSel);
    if(c&&!c.classList.contains('placed')){e.preventDefault();tapChip(c)}
    else if(z&&sel){e.preventDefault();dropSel(z)}
  });
}
window.addEventListener('pointermove',e=>{
  const d=DND.drag;if(!d)return;
  if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>7){
    d.moved=true;const g=d.chip.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');g.style.width=d.w+'px';document.body.appendChild(g);d.ghost=g;d.chip.classList.add('dragging');
  }
  if(d.ghost){d.ghost.style.left=(e.clientX-d.dx)+'px';d.ghost.style.top=(e.clientY-d.dy)+'px'}
});
function endDrag(e){
  const d=DND.drag;if(!d)return;DND.drag=null;
  if(d.ghost){
    d.ghost.remove();d.chip.classList.remove('dragging');
    if(e.type==='pointercancel')return;
    const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest(d.zoneSel);
    if(z&&d.root.contains(z))d.onDrop(d.chip,z);
  }else if(e.type==='pointerup'){d.tap()}
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);

/* ============ لعبة التصنيف (سحب وإفلات) ============ */
function sortGame(root,o){
  let mist=0,left=o.chips.length;
  const names={};o.bins.forEach(b=>names[b.id]=b.label);
  root.innerHTML='<div class="sort"><div class="bank"></div><div class="bins">'+o.bins.map(b=>'<div class="zone '+(b.cls||'')+'" tabindex="0" data-bin="'+b.id+'"><div class="zt">'+(b.emoji||'')+' '+b.label+'</div><div class="zi"></div></div>').join('')+'</div></div>';
  const bank=$('.bank',root);
  shuffle(o.chips).forEach(c=>{const d=document.createElement('div');d.className='chip';d.tabIndex=0;d.dataset.bin=c.bin;d.dataset.why=c.why||'';d.textContent=c.label;bank.appendChild(d)});
  enableDrag(root,'.chip','.zone',(chip,zone)=>{
    if(chip.classList.contains('placed'))return;
    if(chip.dataset.bin===zone.dataset.bin){
      chip.classList.add('placed');chip.classList.remove('sel');$('.zi',zone).appendChild(chip);sfx.ok();left--;
      if(left===0)later(()=>o.onDone(mist),500);
    }else{
      mist++;sfx.bad();zone.classList.add('shake');chip.classList.add('bad');
      setTimeout(()=>{zone.classList.remove('shake');chip.classList.remove('bad')},550);
      toast('❌ '+(chip.dataset.why||('«'+chip.textContent+'» لا ينتمي إلى «'+names[zone.dataset.bin]+'»'))+' — حاول مرة أخرى','bad');
    }
  });
}

/* ============ لعبة التوصيل ============ */
function matchGame(root,o){
  let mist=0,left=o.pairs.length,selL=null,okN=0;
  const L=shuffle(o.pairs.map((p,i)=>({t:p[0],i}))),Rr=shuffle(o.pairs.map((p,i)=>({t:p[1],i})));
  root.innerHTML='<div class="match"><div class="mcol">'+L.map(x=>'<button class="mi" data-s="l" data-i="'+x.i+'">'+x.t+'</button>').join('')+'</div><div class="mcol">'+Rr.map(x=>'<button class="mi" data-s="r" data-i="'+x.i+'">'+x.t+'</button>').join('')+'</div></div>';
  root.onclick=e=>{
    const b=e.target.closest('.mi');if(!b||b.classList.contains('ok'))return;
    if(b.dataset.s==='l'){$$('.mi[data-s=l]',root).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=b;sfx.click();return}
    if(!selL){toast('اختر عنصرًا من العمود الأول ثم اضغط ما يناسبه من العمود الثاني','');return}
    if(selL.dataset.i===b.dataset.i){
      const c='pc'+(okN++%4);selL.classList.remove('sel');selL.classList.add('ok',c);b.classList.add('ok',c);selL=null;sfx.ok();left--;
      if(left===0)later(()=>o.onDone(mist),500);
    }else{
      mist++;sfx.bad();const a=selL;a.classList.add('shake');b.classList.add('shake');
      setTimeout(()=>{a.classList.remove('shake');b.classList.remove('shake');a.classList.remove('sel')},550);selL=null;
      toast('❌ هذا التوصيل غير صحيح، حاول مرة أخرى','bad');
    }
  };
}

/* ============ محرك التحدي (الأسئلة) ============ */
const PRAISE=['ممتاز! 🌟','أحسنت! إجابة صحيحة 👏','رائع، استمر! 🚀','عمل مذهل! 🔬','إجابة دقيقة يا عالِم! ⚡','بطل! 💪'];
function challenge(st,r){
  const qs=r.quiz,total=qs.length;let n=0;
  st.innerHTML='<div class="card"><div class="qhead"><span>🏆 التحدي: أجب عن الأسئلة لتحصل على المفتاح</span><span id="qn"></span></div><div class="qbar"><i id="qfill"></i></div><div id="qbody"></div></div>';
  const next=()=>{if(n>=total)return finish();showQ(qs[n])};
  function showQ(q){
    $('#qn').textContent='السؤال '+(n+1)+' من '+total;$('#qfill').style.width=(n/total*100)+'%';
    const body=$('#qbody');let mist=0;
    body.innerHTML='<h3 class="qt">'+q.q+'</h3><div id="qg"></div><div class="fb" id="fb"></div><div class="qnext" id="qnx"></div>';
    const solved=()=>{
      const pts=mist===0?10:mist===1?5:2,got=award('q'+R.i+'_'+n,pts);
      $('#fb').innerHTML='<div class="good">✅ '+pick(PRAISE)+(q.exp?'<br>'+q.exp:'')+(got?' <b class="gain">+'+got+' نقطة</b>':'')+'</div>';sfx.ok();
      $('#qnx').innerHTML='<button class="btn primary" id="qgo">'+(n+1<total?'السؤال التالي ←':'إنهاء التحدي 🏁')+'</button>';
      $('#qgo').onclick=()=>{n++;next()};
    };
    const wrong=()=>{mist++;sfx.bad();$('#fb').innerHTML='<div class="badm">❌ ليست هذه الإجابة الصحيحة. '+q.hint+'<br>حاول مرة أخرى 💪</div>'};
    const g=$('#qg');
    if(q.t==='mc'||q.t==='tf'){
      const opts=q.t==='mc'?shuffle(q.o.map((t,i)=>({t,ok:i===q.a}))):[{t:'صح ✅',ok:q.a===true},{t:'خطأ ❌',ok:q.a===false}];
      g.innerHTML='<div class="opts '+q.t+'">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o.t+'</button>').join('')+'</div>';
      g.onclick=e=>{
        const b=e.target.closest('.opt');if(!b||b.disabled)return;
        if(opts[b.dataset.i].ok){$$('.opt',g).forEach(x=>x.disabled=true);b.classList.add('good');solved()}
        else{b.disabled=true;b.classList.add('bad');wrong()}
      };
    }else if(q.t==='match'){matchGame(g,{pairs:q.pairs,onDone:m=>{mist=m;solved()}})}
    else if(q.t==='sort'){sortGame(g,{bins:q.bins,chips:q.chips,onDone:m=>{mist=m;solved()}})}
  }
  function finish(){
    $('#qfill').style.width='100%';
    const first=!S.keys[R.i];S.keys[R.i]=true;save();updateHUD();
    later(()=>showKey(R.i,first),500);
  }
  next();
}
const keySVG='<svg viewBox="0 0 160 90" class="keyart"><defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><circle cx="38" cy="45" r="30" fill="url(#kg)" stroke="#b45309" stroke-width="4"/><circle cx="38" cy="45" r="11" fill="#0b1030"/><rect x="64" y="39" width="86" height="12" rx="5" fill="url(#kg)" stroke="#b45309" stroke-width="3"/><rect x="118" y="50" width="10" height="20" rx="3" fill="url(#kg)" stroke="#b45309" stroke-width="3"/><rect x="136" y="50" width="10" height="14" rx="3" fill="url(#kg)" stroke="#b45309" stroke-width="3"/></svg>';
function showKey(i,first){
  sfx.key();confetti(40);
  const last=i===3;
  modal(keySVG+'<h2>🎉 '+(first?'أحسنت! حصلت على مفتاح الغرفة '+(i+1):'أحسنت! أعدت اجتياز التحدي')+'</h2><p>'+(last?'اكتمل جمع المفاتيح الأربعة! بقيت خطوة واحدة: غرفة التحكم الرئيسية.':(first?'فُتح الآن باب «'+ROOMS[i+1].title+'».':'يمكنك العودة إلى الممر.'))+'</p><button class="btn primary big" id="kbtn">'+(last?'ادخل غرفة التحكم ⚡':'العودة إلى الممر 🚪')+'</button>');
  $('#kbtn').onclick=()=>{closeModal();if(last)showFinal();else showHub(first?i+1:-1)};
}
function confetti(n){const cols=['#fbbf24','#22d3c5','#8b5cf6','#fb7185','#38a3ff','#34d399'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=pick(cols);d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}}

/* ============ دوال مساعدة للغرف ============ */
function nextBar(label,target){return '<div class="nextbar"><span class="need" id="need"></span><button class="btn primary" id="nextBtn" data-go="'+target+'" disabled>'+label+' ←</button></div>'}
function bindNext(st){const b=$('#nextBtn',st);if(b)b.addEventListener('click',()=>{R.phase=b.dataset.go;drawRoom();sfx.click()})}
function setNeed(st,t){const n=$('#need',st);if(n)n.textContent=t}
function unlock(st,msg){const b=$('#nextBtn',st);if(b){b.disabled=false;b.classList.add('pulse')}setNeed(st,msg||'✅ ممتاز! يمكنك المتابعة');refreshSteps()}
function exploreDone(st){if(!R.ex){R.ex=true;award('e'+R.i,10);sfx.ok();toast('🎉 أحسنت! أنهيت الاستكشاف (+10 نقاط)','good')}unlock(st)}
function activityDone(st,m){if(!R.ac){R.ac=true;award('a'+R.i,Math.max(5,20-2*m));sfx.ok();toast('🎉 أنجزت النشاط بنجاح!','good')}unlock(st)}

function atomSVG(){
  const P=[[199,180],[170.5,196.5],[170.5,163.5]],N=[[180,180],[189.5,196.5],[161,180],[189.5,163.5]];
  const part=(k,x,y,f,t)=>'<g class="part" data-k="'+k+'"><circle cx="'+x+'" cy="'+y+'" r="11" fill="'+f+'" stroke="#fff6" stroke-width="1.5"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">'+t+'</text></g>';
  const el=(x,y)=>'<g data-k="electron"><circle cx="'+x+'" cy="'+y+'" r="17" fill="transparent"/><circle class="e" cx="'+x+'" cy="'+y+'" r="9" fill="#38a3ff" stroke="#fff" stroke-width="1.5"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">−</text></g>';
  return '<svg class="atomsvg" viewBox="0 0 360 360" role="img" aria-label="نموذج ذرة تفاعلي"><defs><radialGradient id="ag"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs><circle cx="180" cy="180" r="170" fill="url(#ag)"/>'
  +'<circle data-k="orbit" cx="180" cy="180" r="62" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-dasharray="5 5"/><circle data-k="orbit" cx="180" cy="180" r="62" fill="none" stroke="transparent" stroke-width="18"/>'
  +'<circle data-k="orbit" cx="180" cy="180" r="112" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-dasharray="5 5"/><circle data-k="orbit" cx="180" cy="180" r="112" fill="none" stroke="transparent" stroke-width="18"/>'
  +'<g data-k="nucleus"><circle cx="180" cy="180" r="38" fill="rgba(251,113,133,.18)" stroke="rgba(251,113,133,.5)" stroke-dasharray="3 3"/></g>'
  +N.map(p=>part('neutron',p[0],p[1],'#9aa4c7','0')).join('')+P.map(p=>part('proton',p[0],p[1],'#ff5a6e','+')).join('')
  +'<g class="o1">'+el(242,180)+el(118,180)+'</g><g class="o2">'+el(292,180)+'</g></svg>';
}
function exploreAtom(st){
  const need=['proton','neutron','electron'],found=new Set();
  const I={
    proton:{t:'البروتون',sym:'+',col:'#ff5a6e',ch:'شحنة موجبة (+1)',loc:'داخل النواة (مركز الذرة)',tx:'جسيم موجب الشحنة. عدد البروتونات في الذرة هو العدد الذري، وهو الذي يحدد نوع العنصر.'},
    neutron:{t:'النيوترون',sym:'0',col:'#7c88b8',ch:'متعادل (بلا شحنة)',loc:'داخل النواة بجوار البروتونات',tx:'جسيم متعادل لا يحمل شحنة، ويشارك البروتونات في تكوين كتلة الذرة.'},
    electron:{t:'الإلكترون',sym:'−',col:'#38a3ff',ch:'شحنة سالبة (−1)',loc:'يدور حول النواة في مستويات الطاقة',tx:'جسيم سالب الشحنة وكتلته صغيرة جدًا. الذرة متعادلة لأن عدد الإلكترونات = عدد البروتونات (هنا 3 بروتونات و 3 إلكترونات).'},
    nucleus:{t:'النواة',sym:'⚛',col:'#fb7185',ch:'موجبة الشحنة',loc:'مركز الذرة',tx:'تحتوي على البروتونات والنيوترونات، وتتركز فيها معظم كتلة الذرة.'},
    orbit:{t:'مستويات الطاقة',sym:'◯',col:'#7c5cff',ch:'مسارات حول النواة',loc:'حول النواة',tx:'مسارات تدور فيها الإلكترونات. المستوى الأول يتسع لإلكترونين، والثاني لثمانية إلكترونات.'}
  };
  st.innerHTML='<div class="split"><div class="card center">'+atomSVG()+'<p class="hint">👆 اضغط على مكوّنات الذرة لتكتشفها (ذرة ليثيوم: 3 بروتونات، 4 نيوترونات، 3 إلكترونات)</p><div class="legend"><button class="lg" data-k="proton">🔴 بروتون</button><button class="lg" data-k="neutron">⚪ نيوترون</button><button class="lg" data-k="electron">🔵 إلكترون</button><button class="lg" data-k="nucleus">النواة</button><button class="lg" data-k="orbit">مستويات الطاقة</button></div></div><div class="card info" id="info"><h3>🔍 مركز المعلومات</h3><p>اضغط على أي جزء من الذرة لتظهر هنا شحنته ومكانه ووظيفته.</p><p class="pill">يجب أن تكتشف: البروتون، النيوترون، الإلكترون</p></div></div>'+nextBar('الانتقال إلى النشاط','activity');
  setNeed(st,'اكتشفت 0 / 3');
  st.addEventListener('click',e=>{
    const g=e.target.closest('[data-k]');if(!g)return;const k=g.dataset.k,d=I[k];if(!d)return;sfx.click();
    $('#info',st).innerHTML='<div class="ib" style="--c:'+d.col+'"><div class="bigsym">'+d.sym+'</div><div><h3>'+d.t+'</h3><span class="pill">'+d.ch+'</span></div></div><p><b>📍 المكان:</b> '+d.loc+'</p><p>'+d.tx+'</p>';
    $$('[data-k="'+k+'"]',st).forEach(x=>x.classList.add('found'));
    if(need.includes(k)){found.add(k);setNeed(st,'اكتشفت '+found.size+' / 3');if(found.size===3)exploreDone(st)}
  });
}

    {label:'جسيم متعادل الشحنة',bin:'nuc',why:'الجسيم المتعادل هو النيوترون وهو داخل النواة'},{label:'جسيم يدور حول النواة',bin:'orb',why:'الذي يدور حول النواة هو الإلكترون'}],

/* ---------- الغرفة 2: الجدول الدوري ---------- */
function ptHTML(cls){
  let h='<div class="ptw"><div class="pt '+(cls||'')+'">';
  for(let g=1;g<=18;g++)h+='<i class="gh" style="grid-column:'+(g+1)+';grid-row:1">'+g+'</i>';
  for(let p=1;p<=4;p++)h+='<i class="ph" style="grid-column:1;grid-row:'+(p+1)+'">'+p+'</i>';
  h+='<div class="gap">العناصر الانتقالية (تُدرس لاحقًا)</div>';
  EL.forEach(e=>{h+='<button class="ec '+e.c+'" data-z="'+e.z+'" data-g="'+e.g+'" data-p="'+e.p+'" style="grid-column:'+(e.g+1)+';grid-row:'+(e.p+1)+'" aria-label="'+e.n+'"><small>'+e.z+'</small><b>'+e.s+'</b><span>'+e.n+'</span></button>'});
  return h+'</div></div>';
}
function exploreTable(st){
  const seen=new Set();let flt=null;
  st.innerHTML='<div class="card"><h3>🧪 الجدول الدوري المبسّط (أول 20 عنصرًا)</h3><p class="ptcap">الأعمدة الرأسية = <b>المجموعات</b> (1–18) ، والصفوف الأفقية = <b>الدورات</b> (1–4). اضغط على أي عنصر. (على الموبايل مرّر الجدول يمينًا ويسارًا)</p>'
   +'<div class="legend" id="lgd">'+Object.keys(CN).map(k=>'<button class="lg" data-f="'+k+'"><span class="ec '+k+'" style="padding:0 6px;border-radius:6px;display:inline-block">&nbsp;</span> '+CN[k]+'</button>').join('')+'</div>'
   +ptHTML('')+'</div><div class="card info" id="info" style="margin-top:14px"><h3>🔍 بطاقة العنصر</h3><p>اضغط على عنصر لتعرف رمزه وموقعه وتصنيفه. اكتشف 6 عناصر على الأقل للمتابعة.</p></div>'+nextBar('الانتقال إلى النشاط','activity');
  setNeed(st,'اكتشفت 0 / 6 عناصر');
  const cells=$$('.ec[data-z]',st);
  st.addEventListener('click',e=>{
    const f=e.target.closest('[data-f]');
    if(f){flt=flt===f.dataset.f?null:f.dataset.f;cells.forEach(c=>c.classList.toggle('dim',!!flt&&!c.classList.contains(flt)));sfx.click();return}
    const c=e.target.closest('.ec[data-z]');if(!c)return;
    const el=EL.find(x=>x.z==c.dataset.z);sfx.click();
    cells.forEach(x=>{x.classList.toggle('hl',x.dataset.g===c.dataset.g||x.dataset.p===c.dataset.p);x.classList.toggle('sel',x===c)});
    $('#info',st).innerHTML='<div class="elcard"><div class="etile ec '+el.c+'"><small>'+el.z+'</small><b>'+el.s+'</b></div><div><h3>'+el.n+'</h3><span class="pill">'+CN[el.c]+'</span></div></div>'
     +'<div class="facts"><div>🔢 العدد الذري: <b>'+el.z+'</b> (= عدد البروتونات)</div><div>📍 الدورة: <b>'+el.p+'</b></div><div>📍 المجموعة: <b>'+el.g+'</b></div><div>🧊 الحالة: <b>'+el.st+'</b></div></div><p>💡 '+el.f+'</p><p style="color:var(--mu)">'+CD[el.c]+'</p>';
    seen.add(el.z);setNeed(st,'اكتشفت '+Math.min(seen.size,6)+' / 6 عناصر'+(seen.size>=6?'':''));
    if(seen.size>=6)exploreDone(st);
  });
}

/* ---------- الغرفة 3: المادة وخواصها ---------- */
function startParticles(cv,state){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;let id,ps=[];
  const top=state==='liquid'?H*.38:6;
  if(state==='solid'){for(let i=0;i<9;i++)for(let j=0;j<5;j++)ps.push({hx:30+i*25,hy:22+j*25,t:Math.random()*6})}
  else if(state==='liquid'){for(let i=0;i<46;i++)ps.push({x:16+Math.random()*(W-32),y:top+10+Math.random()*(H-top-20),vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4})}
  else{for(let i=0;i<14;i++)ps.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*4.5,vy:(Math.random()-.5)*4.5})}
  const col=state==='solid'?'#fbbf24':state==='liquid'?'#38a3ff':'#34d399';
  function f(t){
    c.clearRect(0,0,W,H);
    if(state==='liquid'){c.fillStyle='rgba(56,163,255,.14)';c.fillRect(2,top,W-4,H-top-2)}
    ps.forEach(p=>{
      if(state==='solid'){p.x=p.hx+Math.sin(t/110+p.t)*1.6;p.y=p.hy+Math.cos(t/130+p.t)*1.6}
      else{p.x+=p.vx;p.y+=p.vy;if(p.x<10||p.x>W-10)p.vx*=-1;if(p.y<top+6||p.y>H-10)p.vy*=-1}
      c.beginPath();c.arc(p.x,p.y,8,0,7);c.fillStyle=col;c.fill();c.strokeStyle='#fff8';c.lineWidth=1.2;c.stroke();
    });
    id=requestAnimationFrame(f);
  }
  id=requestAnimationFrame(f);
  return()=>cancelAnimationFrame(id);
}

function ionicSVG(){
  let cl='';
  for(let a=0;a<360;a+=45){if(a===180)continue;cl+='<circle class="el" cx="'+(62*Math.cos(a*Math.PI/180)).toFixed(1)+'" cy="'+(62*Math.sin(a*Math.PI/180)).toFixed(1)+'" r="6"/>'}
  return '<svg class="bsvg" id="isvg" viewBox="0 0 520 250" role="img" aria-label="تكوّن الرابطة الأيونية في كلوريد الصوديوم">'
   +'<g class="t" id="na" style="transform:translate(130px,115px)"><circle class="ring" id="nring" r="62"/><circle r="30" fill="#d97706" stroke="#fff" stroke-width="2"/><text y="8" font-size="22" font-weight="900">Na</text><text id="nal" y="92" font-size="15">ذرة صوديوم (فلز)</text><g id="nplus" class="fade" opacity="0"><circle cx="46" cy="-46" r="14" fill="#fb7185"/><text x="46" y="-40" font-size="20" font-weight="900">+</text></g></g>'
   +'<g class="t" id="cl" style="transform:translate(390px,115px)"><circle class="ring" r="62"/>'+cl+'<circle class="el hot fade" id="clx" cx="-62" cy="0" r="6" opacity="0"/><circle class="vac fade" cx="-62" cy="0" r="8" fill="none" stroke="#fff" stroke-dasharray="3 3"/><circle r="30" fill="#0d9488" stroke="#fff" stroke-width="2"/><text y="8" font-size="22" font-weight="900">Cl</text><text id="cll" y="92" font-size="15">ذرة كلور (لافلز)</text><g id="cminus" class="fade" opacity="0"><circle cx="46" cy="-46" r="14" fill="#38a3ff"/><text x="46" y="-40" font-size="20" font-weight="900">−</text></g></g>'
   +'<circle class="el hot" id="mv" r="7" cx="0" cy="0" style="transform:translate(192px,115px);transition:transform 1.2s ease,opacity .5s"/>'
   +'<g id="pull" class="fade" opacity="0"><text x="260" y="110" font-size="30">⟷</text><text x="260" y="140" font-size="14" fill="#fde68a">تجاذب كهربي</text></g>'
   +'<text id="itxt" x="260" y="238" font-size="16" fill="#7ff5ea">اضغط «ابدأ» لترى انتقال الإلكترون من Na إلى Cl</text></svg>';
}
function playIonic(host,done){
  const s=$('#isvg',host);if(!s||s.dataset.run)return;s.dataset.run='1';
  const mv=$('#mv',s);mv.style.transform='translate(328px,115px)';
  later(()=>{mv.style.opacity=0;$('#clx',s).style.opacity=1;$('.vac',s).style.opacity=0;$('#nring',s).classList.add('lost');$('#nplus',s).setAttribute('opacity',1);$('#cminus',s).setAttribute('opacity',1);$('#nal',s).textContent='أيون الصوديوم Na⁺';$('#cll',s).textContent='أيون الكلوريد Cl⁻';sfx.ok()},1300);
  later(()=>{$('#na',s).style.transform='translate(165px,115px)';$('#cl',s).style.transform='translate(355px,115px)'},2000);
  later(()=>{$('#pull',s).setAttribute('opacity',1);$('#itxt',s).textContent='رابطة أيونية: تجاذب بين أيون موجب وأيون سالب ← NaCl';done()},3200);
}
function covalentSVG(){

  return '<svg class="bsvg" id="csvg" viewBox="0 0 520 290" role="img" aria-label="تكوّن الرابطة التساهمية في جزيء الماء">'
   +'<g transform="translate(260 105)"><circle class="ring" r="62"/>'+O+'<circle r="30" fill="#dc2626" stroke="#fff" stroke-width="2"/><text y="8" font-size="22" font-weight="900">O</text></g>'
   +'<ellipse class="fade" id="pl" cx="222.6" cy="142.5" rx="22" ry="12" transform="rotate(-45 222.6 142.5)" fill="#fde68a" opacity="0" style="filter:blur(3px)"/><ellipse class="fade" id="pr" cx="297.4" cy="142.5" rx="22" ry="12" transform="rotate(45 297.4 142.5)" fill="#fde68a" opacity="0" style="filter:blur(3px)"/>'

    const a=e.target.closest('.ach'),s=e.target.closest('.slot'),t=e.target.closest('.tb');
    if(a){const k=slots.indexOf(null);if(k>=0){slots[k]=a.dataset.a;sfx.click()}else toast('الذرتان موجودتان بالفعل، اضغط على إحداهما لإزالتها','')}
    else if(s){slots[+s.dataset.s]=null}
    else if(t){type=t.dataset.t;sfx.click()}
    else if(e.target.closest('#chk')){check();return}
    else return;
    draw();
  });
  const check=()=>{
    if(!slots[0]||!slots[1]||!type){toast('اختر ذرتين ونوع الرابطة أولًا','');return}
    const T0=T[i],pair=[...slots].sort().join('+'),fb=$('#fb',st);
    if(pair!==T0.pair){mist++;sfx.bad();fb.innerHTML='<div class="badm">❌ هاتان الذرتان لا تكوّنان المركب المطلوب. تلميح: انظر إلى رمز المركب في المهمة ولاحظ الذرات المكوّنة له.</div>';return}
    if(type!==T0.type){mist++;sfx.bad();fb.innerHTML='<div class="badm">❌ الذرتان صحيحتان، لكن نوع الرابطة غير صحيح. تذكّر: فلز + لافلز ⇐ أيونية (انتقال إلكترونات)، ولافلز + لافلز ⇐ تساهمية (مشاركة).</div>';return}
    sfx.ok();fb.innerHTML='<div class="good">✅ أحسنت! '+T0.ok+'</div>';
    i++;slots=[null,null];type=null;
    if(i>=T.length){later(()=>{activityDone(st,mist)},900);$('#chk',st).disabled=true;$('#tk',st).textContent='🎉 أنجزت جميع المهام!';draw();$('#tk',st).textContent='🎉 أنجزت جميع المهام!'}
    else later(draw,900);
  };
  draw();
}

/* ============ تعريف الغرف ============ */
const ROOMS=[
 {icon:'⚛️',name:'الغرفة الأولى',title:'تركيب الذرة',color:'#fb7185',goal:'اكتشف مكوّنات الذرة وشحناتها وأماكنها.',explore:exploreAtom,activity:activityAtom,quiz:Q1},
 {icon:'🧪',name:'الغرفة الثانية',title:'الجدول الدوري',color:'#f59e0b',goal:'تعرّف على العناصر وموقعها وتصنيفها في الجدول الدوري.',explore:exploreTable,activity:activityTable,quiz:Q2},
 {icon:'🧊',name:'الغرفة الثالثة',title:'المادة وخواصها',color:'#22d3c5',goal:'استكشف المواد المختلفة وحالاتها وخواصها.',explore:exploreMatter,activity:activityMatter,quiz:Q3},
 {icon:'🔗',name:'الغرفة الرابعة',title:'الروابط الكيميائية',color:'#8b5cf6',goal:'اكتشف كيف ترتبط الذرات ببعضها.',explore:exploreBonds,activity:activityBonds,quiz:Q4}
];
const MAXPTS=ROOMS.length*80;

/* ============ الشاشات ============ */
let R={i:0,phase:'explore',ex:false,ac:false};
function setHud(on){$('#hud').hidden=!on;if(on)updateHUD()}

function labSVG(){return '<svg viewBox="0 0 520 380" class="labsvg" role="img" aria-label="معمل علوم افتراضي مغلق"><defs><linearGradient id="lw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202a78"/><stop offset="1" stop-color="#0c1240"/></linearGradient><linearGradient id="la" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient><linearGradient id="lb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><radialGradient id="lg"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".5"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient></defs>'
 +'<rect width="520" height="380" rx="26" fill="url(#lw)"/><g stroke="#ffffff1c" stroke-width="2"><path d="M0 70H520M0 140H520M0 210H520M130 0V300M260 0V300M390 0V300"/></g><rect y="300" width="520" height="80" fill="#080c2c"/><path d="M0 300H520" stroke="#5b6bff" stroke-width="3"/><circle cx="260" cy="165" r="150" fill="url(#lg)"/>'
 +'<g transform="translate(260 165)"><circle r="96" fill="#111a58" stroke="#6270ff" stroke-width="7"/><circle r="74" fill="none" stroke="#3b49d8" stroke-width="3" stroke-dasharray="10 9" class="spin"/><circle r="34" fill="#0a1030" stroke="#fb7185" stroke-width="5"/><text y="13" text-anchor="middle" font-size="38" fill="#fb7185" class="blink">⚠</text></g>'
 +'<g transform="translate(70 300)"><path d="M-12 -92V-58L-38 0H38L12 -58V-92Z" fill="#ffffff14" stroke="#cbd5ff" stroke-width="3"/><path d="M-26 -24L26 -24L38 0H-38Z" fill="url(#la)"/><circle class="bub" cx="-6" cy="-28" r="4" fill="#fff8"/><circle class="bub" cx="8" cy="-26" r="3" fill="#fff8" style="animation-delay:1s"/></g>'
 +'<g transform="translate(150 300)"><rect x="-16" y="-80" width="32" height="80" rx="8" fill="#ffffff14" stroke="#cbd5ff" stroke-width="3"/><rect x="-13" y="-46" width="26" height="43" rx="6" fill="url(#lb)"/><circle class="bub" cx="0" cy="-48" r="3" fill="#fff8" style="animation-delay:.5s"/></g>'
 +'<g transform="translate(405 220)"><rect width="90" height="62" rx="8" fill="#0a1030" stroke="#6270ff" stroke-width="4"/><text x="45" y="38" text-anchor="middle" font-size="16" fill="#fb7185" class="blink">خلل!</text><rect x="36" y="62" width="18" height="18" fill="#6270ff"/><rect x="18" y="80" width="54" height="6" rx="3" fill="#6270ff"/></g>'
 +'<g transform="translate(90 70)"><circle r="7" fill="#fb7185"/><g class="spin"><ellipse rx="30" ry="11" fill="none" stroke="#7dd3fc" stroke-width="2"/><circle cx="30" r="4" fill="#38a3ff"/></g><g class="spin" style="animation-duration:9s;animation-direction:reverse"><ellipse rx="30" ry="11" fill="none" stroke="#7dd3fc" stroke-width="2" transform="rotate(60)"/><circle cx="-15" cy="26" r="4" fill="#38a3ff"/></g></g>'
 +'<g transform="translate(440 80)"><circle r="6" fill="#fbbf24"/><g class="spin" style="animation-duration:8s"><ellipse rx="26" ry="9" fill="none" stroke="#c4b5fd" stroke-width="2"/><circle cx="26" r="4" fill="#a78bfa"/></g></g></svg>'}

function showStart(){
  clean();setHud(false);
  const has=S.points>0||S.keys.some(Boolean);
  app.innerHTML='<section class="scr start"><div>'+labSVG()+'</div><div><span class="tag">🔬 لعبة تعليمية • الصف الأول الإعدادي • وحدة المادة</span><h1>مغامرة إنقاذ <span>عالم المادة</span></h1><div class="card story"><b>📜 القصة</b><p>«حدث خلل داخل معمل العلوم، وتوقفت أنظمته، وأُغلقت أبوابه. مهمتك استكشاف أربع غرف علمية وحل التحديات الموجودة بداخلها حتى تتمكن من إعادة تشغيل المعمل وإنقاذ عالم المادة».</p></div><div class="actions">'+(has?'<button class="btn primary big" id="goOn">▶ تابع المغامرة</button><button class="btn" id="goNew">🔄 مغامرة جديدة</button>':'<button class="btn primary big pulse" id="goNew">🚀 ابدأ المغامرة</button>')+'</div><div class="feat"><span>⚛️ الذرة</span><span>🧪 الجدول الدوري</span><span>🧊 المادة وخواصها</span><span>🔗 الروابط الكيميائية</span></div></div></section>';
  const startNew=()=>{S=fresh();S.started=true;save();sfx.click();showHub()};
  $('#goNew').onclick=()=>{if(has)confirmBox('سيتم مسح تقدمك الحالي. هل تريد البدء من جديد؟',startNew);else startNew()};
  if(has)$('#goOn').onclick=()=>{S.started=true;showHub()};
}

function showHub(opened){
  clean();setHud(true);window.scrollTo(0,0);
  const all=S.keys.every(Boolean),nx=S.keys.findIndex(k=>!k);
  app.innerHTML='<section class="scr hub"><div class="card hub-head"><h2>🏛️ ممر المعمل الرئيسي</h2><p>الأبواب مغلقة بسبب الخلل. أنجز تحدي كل غرفة لتحصل على مفتاحها وتفتح الباب التالي. لا يمكنك تجاوز غرفة قبل إكمال تحديها.</p></div><div class="doors">'
   +ROOMS.map((r,i)=>{const done=S.keys[i],open=i===0||S.keys[i-1];return '<button class="door '+(done?'done open':open?'open':'locked')+(opened===i?' justopened':'')+'" data-i="'+i+'" style="--rc:'+r.color+'"><span class="dnum">'+(i+1)+'</span><div class="dleaf"><div class="dwin">'+(open?r.icon:'🔒')+'</div><div class="dknob"></div></div><div class="dname">'+r.title+'</div><div class="dst">'+(done?'✅ مكتملة — راجِع الغرفة':open?'🔓 مفتوحة — ادخل':'🔒 مغلقة')+'</div></button>'}).join('')
   +'<button class="door '+(all?'open':'locked')+(opened===4?' justopened':'')+'" data-i="4" style="--rc:#fbbf24"><span class="dnum">★</span><div class="dleaf"><div class="dwin">'+(all?'🎛️':'🔒')+'</div><div class="dknob"></div></div><div class="dname">غرفة التحكم</div><div class="dst">'+(all?'🔓 أعد تشغيل المعمل':'🔒 تحتاج 4 مفاتيح')+'</div></button></div>'
   +'<div class="next-hint">'+(all?'🎉 جمعت المفاتيح الأربعة! ادخل غرفة التحكم الرئيسية.':'👉 المهمة التالية: '+ROOMS[nx].name+' — '+ROOMS[nx].title)+'</div><div class="foot"><button class="link" id="rst">🔄 البدء من جديد</button></div></section>';
  $$('.door',app).forEach(d=>d.onclick=()=>{
    const i=+d.dataset.i;
    if(i===4){if(all){sfx.click();showFinal()}else{sfx.bad();d.classList.add('shake');toast('🔒 غرفة التحكم تحتاج إلى المفاتيح الأربعة','bad')}return}
    if(i===0||S.keys[i-1]){sfx.click();openRoom(i)}else{sfx.bad();toast('🔒 هذا الباب مغلق! أنجز تحدي «'+ROOMS[i-1].title+'» أولًا','bad')}
  });
  $('#rst').onclick=()=>confirmBox('سيتم مسح تقدمك ونقاطك. هل أنت متأكد؟',()=>{S=fresh();S.started=true;save();showHub()});
}

function openRoom(i){R={i,phase:'explore',ex:!!S.keys[i],ac:!!S.keys[i]};drawRoom()}
function stepsHTML(){
  const P=[['explore','🔍','1) استكشف وتعلّم',true,R.ex],['activity','🧩','2) النشاط',R.ex,R.ac],['challenge','🏆','3) التحدي',R.ex&&R.ac,!!S.keys[R.i]]];
  return P.map(p=>'<button data-p="'+p[0]+'" class="'+(R.phase===p[0]?'act ':'')+(p[4]?'ok':'')+'"'+(p[3]?'':' disabled')+'>'+(p[3]?p[1]:'🔒')+' '+p[2]+'</button>').join('');
}
function refreshSteps(){const n=$('.steps');if(n)n.innerHTML=stepsHTML()}
function drawRoom(){
  clean();setHud(true);window.scrollTo(0,0);
  const r=ROOMS[R.i];
  app.innerHTML='<section class="scr room" style="--rc:'+r.color+'"><div class="room-head"><div class="badge">'+r.icon+'</div><div><div class="kicker">'+r.name+'</div><h2>'+r.title+'</h2><div class="kicker">'+r.goal+'</div></div></div><nav class="steps">'+stepsHTML()+'</nav><div id="stage"></div></section>';
  $('.steps').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(b&&!b.disabled){R.phase=b.dataset.p;sfx.click();drawRoom()}});
  const st=$('#stage');
  ({explore:r.explore,activity:r.activity,challenge:challenge})[R.phase](st,r);
  bindNext(st);
  if(R.phase==='explore'&&R.ex)unlock(st);
  if(R.phase==='activity'&&R.ac)unlock(st);
}

function showFinal(){
  clean();setHud(true);window.scrollTo(0,0);
  app.innerHTML='<section class="scr final dark" id="fin"><div class="shade"></div><div class="card ctrl"><h2>🎛️ غرفة التحكم الرئيسية</h2><p id="ctext">أدخلت المفاتيح الأربعة. اضغط الزر لإعادة تشغيل أنظمة المعمل وإنقاذ عالم المادة!</p><div class="reactor" id="reactor"><div class="core"></div></div><div class="socks">'+ROOMS.map((r,i)=>'<div class="sock" id="sk'+i+'">🗝️</div>').join('')+'</div><ul class="log" id="log"></ul><button class="btn primary big pulse" id="boot">⚡ أعد تشغيل المعمل</button></div><div id="result"></div></section>';
  const result=()=>{
    const pct=S.points/MAXPTS,stars=pct>=.85?3:pct>=.6?2:1,rank=stars===3?'عالِم المادة الأول 🏅':stars===2?'مستكشف ماهر 🔬':'مستكشف مجتهد 💪';
    $('#fin').classList.remove('dark');$('#reactor').classList.add('on');
    $$('.sock').forEach(s=>s.classList.add('on'));$('#boot').remove();
    $('#ctext').textContent='عادت الإضاءة وتعمل جميع أنظمة المعمل! 💡';
    $('#result').innerHTML='<div class="card resbox scr"><h1>🎉 أحسنت! لقد نجحت في إنقاذ عالم المادة</h1><div class="stars">'+'★'.repeat(stars)+'<span style="opacity:.25">'+'★'.repeat(3-stars)+'</span></div><p>رتبتك: <b>'+rank+'</b></p><p>مجموع نقاطك</p><div class="scorebig">'+S.points+' / '+MAXPTS+'</div><p style="color:var(--mu)">المفاتيح: 4 / 4 • الغرف المكتملة: 4 / 4</p><div class="row"><button class="btn primary big" id="again">🔄 إعادة اللعب</button><button class="btn" id="back">🏛️ العودة إلى الممر</button></div></div>';
    $('#again').onclick=()=>{S=fresh();S.started=true;save();sfx.click();showHub()};
    $('#back').onclick=()=>showHub();
    S.finished=true;save();sfx.on();confetti(90);
  };
  $('#boot').onclick=()=>{
    $('#boot').disabled=true;$('#boot').classList.remove('pulse');
    const L=['✔ تشغيل نظام الذرة ⚛️','✔ مزامنة الجدول الدوري 🧪','✔ ضبط حالات المادة 🧊','✔ تثبيت الروابط الكيميائية 🔗','✔ استعادة الطاقة الرئيسية ⚡'];
    L.forEach((t,i)=>later(()=>{
      const li=document.createElement('li');li.textContent=t;$('#log').appendChild(li);sfx.click();
      if(i<4)$('#sk'+i).classList.add('on');
      if(i===4)later(result,900);
    },i*800));
  };
  if(S.finished)result();
}

/* ============ التشغيل ============ */
function init(){
  const bg=$('#bg');
  for(let i=0;i<16;i++){const d=document.createElement('div'),s=14+Math.random()*46;d.className='fa';d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'%;animation-duration:'+(22+Math.random()*30)+'s;animation-delay:-'+Math.random()*40+'s';bg.appendChild(d)}
  $('#homeBtn').onclick=()=>{sfx.click();if(S.started)showHub();else showStart()};
  $('#muteBtn').onclick=()=>{S.mute=!S.mute;save();updateHUD()};
  showStart();
}
init();
</script>
</body>
